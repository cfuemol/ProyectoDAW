{% extends "base.html" %} {% block title %}Registrar Usuario{% endblock %} {%
block nav %}
<nav class="top-nav">
  <div class="nav-links">
    <a href="/admin_dashboard">← Volver al Panel</a>
  </div>
</nav>
{% endblock %} {% block content %}
<h2>Registrar Nuevo Usuario</h2>

<form method="POST" action="/register">
  <label for="rol">Rol:</label>
  <select id="rol" name="rol" required>
    <option value="">Selecciona un rol</option>
    <option value="administrador">Administrador</option>
    <option value="direccion">Dirección</option>
    <option value="profesional">Profesional</option>
    <option value="mostrador">Mostrador</option></select
  ><br /><br />

  <label for="dni">DNI:</label>
  <input
    type="text"
    id="dni"
    name="dni"
    placeholder="12345678Z o X1234567L"
    required
  /><br /><br />

  <label for="nombre">Nombre:</label>
  <input
    type="text"
    id="nombre"
    name="nombre"
    placeholder="Mín. 6 letras"
    required
  /><br /><br />

  <label for="apellidos">Apellidos:</label>
  <input
    type="text"
    id="apellidos"
    name="apellidos"
    placeholder="Mín. 6 letras"
    required
  /><br /><br />

  <label for="categoria">Categoría:</label>
  <select id="categoria" name="categoria" required>
    <option value="Médico/a">Médico/a</option>
    <option value="DUE">DUE</option>
    <option value="TCAE">TCAE</option>
    <option value="Aux Administrativo/a">Aux Administrativo/a</option>
    <option value="Administrativo/a">Administrativo/a</option>
    <option value="Celador/a-Conductor/a">Celador/a-Conductor/a</option>
    <option value="Técnico/a de Rayos">Técnico/a de Rayos</option>
    <option value="Odontólogo/a">Odontólogo/a</option>
    <option value="Trabajador/a Social">Trabajador/a Social</option>
    <option value="Fisioterapeuta">Fisioterapeuta</option>
    <option value="Matrón/a">Matrón/a</option></select
  ><br /><br />

  <label for="unidad_asignada">Unidad Asignada:</label>
  <select id="unidad_asignada" name="unidad_asignada" required>
    <option value="ZBS Albuñol">ZBS Albuñol</option>
    <option value="ZBS Motril">ZBS Motril</option>
    <option value="Dispositivo Apoyo Granada">Dispositivo Apoyo Granada</option>
    <option value="ZBS Almuñecar">ZBS Almuñecar</option></select
  ><br /><br />

  <label for="centro_asignado">Centro Asignado:</label>
  <select id="centro_asignado" name="centro_asignado" required>
    <option value="Albuñol">Albuñol</option>
    <option value="Albondón">Albondón</option>
    <option value="Alfornón">Alfornón</option>
    <option value="El Pozuelo">El Pozuelo</option>
    <option value="La Rábita">La Rábita</option>
    <option value="Los Castillas">Los Castillas</option>
    <option value="Polopos">Polopos</option>
    <option value="Sorvilán">Sorvilán</option>
    <option value="Dispositivo Apoyo Granada Sur">
      Dispositivo Apoyo Granada Sur
    </option>
    <option value="Distrito Sanitario Granada Sur (SAS)">
      Distrito Sanitario Granada Sur (SAS)
    </option></select
  ><br /><br />

  <label for="telefono">Teléfono:</label>
  <input
    type="number"
    id="telefono"
    name="telefono"
    placeholder="600123456"
    required
  /><br /><br />

  <label for="email">Email:</label>
  <input
    type="email"
    id="email"
    name="email"
    placeholder="ejemplo@correo.com"
    required
  /><br /><br />

  <label for="password">Contraseña:</label>
  <input
    type="password"
    id="password"
    name="password"
    placeholder="Min. 8-12 car, A, a, 1, #"
    required
  /><br /><br />

  <button type="submit" id="submit_btn" disabled>Registrar Usuario</button>
</form>

<style>
  .alert {
    padding: 10px;
    background-color: #f44336;
    color: white;
    margin-bottom: 15px;
    border-radius: 4px;
  }
  .is-invalid {
    border: 2px solid red !important;
  }
  .is-valid {
    border: 2px solid green !important;
  }
</style>
<script>
  const rolSelect = document.getElementById("rol");
  const categoriaSelect = document.getElementById("categoria");
  const unidadAsignadaSelect = document.getElementById("unidad_asignada");
  const centroAsignadoSelect = document.getElementById("centro_asignado");

  const ADMIN_CAT = "Técnico Especialista en Informática";
  const ADMIN_UNIDAD = "SAS";
  const ADMIN_CENTRO = "Distrito Sanitario Granada Sur (SAS)";

  function updateAdminFields() {
    // Limpiar opciones previas si no es admin
    if (rolSelect.value !== "administrador") {
      Array.from(categoriaSelect.options).forEach((opt) => {
        if (opt.value === ADMIN_CAT) opt.remove();
      });
      Array.from(unidadAsignadaSelect.options).forEach((opt) => {
        if (opt.value === ADMIN_UNIDAD) opt.remove();
      });
      Array.from(centroAsignadoSelect.options).forEach((opt) => {
        if (opt.value === ADMIN_CENTRO) opt.remove();
      });

      categoriaSelect.removeAttribute("readonly");
      unidadAsignadaSelect.removeAttribute("readonly");
      centroAsignadoSelect.removeAttribute("readonly");

      // Mostrar Dispositivo Apoyo Granada Sur para otros roles
      Array.from(centroAsignadoSelect.options).forEach((opt) => {
        if (opt.value === "Dispositivo Apoyo Granada Sur")
          opt.style.display = "";
      });
    } else {
      // Es administrador
      if (
        !Array.from(categoriaSelect.options).some(
          (opt) => opt.value === ADMIN_CAT,
        )
      ) {
        const opt = document.createElement("option");
        opt.value = ADMIN_CAT;
        opt.text = ADMIN_CAT;
        categoriaSelect.add(opt);
      }
      categoriaSelect.value = ADMIN_CAT;

      if (
        !Array.from(unidadAsignadaSelect.options).some(
          (opt) => opt.value === ADMIN_UNIDAD,
        )
      ) {
        const opt = document.createElement("option");
        opt.value = ADMIN_UNIDAD;
        opt.text = ADMIN_UNIDAD;
        unidadAsignadaSelect.add(opt);
      }
      unidadAsignadaSelect.value = ADMIN_UNIDAD;

      if (
        !Array.from(centroAsignadoSelect.options).some(
          (opt) => opt.value === ADMIN_CENTRO,
        )
      ) {
        const opt = document.createElement("option");
        opt.value = ADMIN_CENTRO;
        opt.text = ADMIN_CENTRO;
        centroAsignadoSelect.add(opt);
      }
      centroAsignadoSelect.value = ADMIN_CENTRO;

      // Ocultar Dispositivo Apoyo Granada Sur para admin
      Array.from(centroAsignadoSelect.options).forEach((opt) => {
        if (opt.value === "Dispositivo Apoyo Granada Sur")
          opt.style.display = "none";
      });

      categoriaSelect.setAttribute("readonly", true);
      unidadAsignadaSelect.setAttribute("readonly", true);
      centroAsignadoSelect.setAttribute("readonly", true);
    }
  }

  const form = document.querySelector("form");
  const submitBtn = document.getElementById("submit_btn");
  const dniInput = document.getElementById("dni");
  const emailInput = document.getElementById("email");
  const telefonoInput = document.getElementById("telefono");
  const inputs = form.querySelectorAll("input[required], select[required]");

  function validarDNI(value) {
    const validChars = "TRWAGMYFPDXBNJZSQVHLCKE";
    const nifRegex = /^[0-9]{8}[TRWAGMYFPDXBNJZSQVHLCKE]$/i;
    const nieRegex = /^[XYZ][0-9]{7}[TRWAGMYFPDXBNJZSQVHLCKE]$/i;

    if (!nifRegex.test(value) && !nieRegex.test(value)) return false;

    let nieValue = value
      .replace(/^[X]/i, "0")
      .replace(/^[Y]/i, "1")
      .replace(/^[Z]/i, "2");

    const number = parseInt(nieValue.slice(0, 8), 10);
    const letter = value.slice(-1).toUpperCase();

    return validChars[number % 23] === letter;
  }

  function validarEmail(email) {
    // Regex: Empieza con letra, seguido de estructura de email
    const emailRegex = /^[a-zA-Z][^\s@]*@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
  }

  function validarPassword(pass) {
    // 8-12 caracteres, 1 mayus, 1 minus, 1 numero, 1 simbolo
    const hasUpper = /[A-Z]/.test(pass);
    const hasLower = /[a-z]/.test(pass);
    const hasNumber = /[0-9]/.test(pass);
    const hasSymbol = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass);
    const validLength = pass.length >= 8 && pass.length <= 12;
    return hasUpper && hasLower && hasNumber && hasSymbol && validLength;
  }

  function validarTelefono(telefono) {
    const telRegex = /^[6789]\d{8}$/;
    return telRegex.test(telefono);
  }

  function updateValidationStyles(input, isValid) {
    if (input.value.trim() === "") {
      // Si está vacío y es requerido, es inválido (borde rojo si es select o si ya se ha interactuado)
      // Pero para no saturar, quitamos clases si está vacío pero mantenemos el botón deshabilitado
      input.classList.remove("is-valid", "is-invalid");
    } else if (isValid) {
      input.classList.add("is-valid");
      input.classList.remove("is-invalid");
    } else {
      input.classList.add("is-invalid");
      input.classList.remove("is-valid");
    }
  }

  function validateForm() {
    let allValid = true;

    const isDniValid = validarDNI(dniInput.value);
    const isEmailValid = validarEmail(emailInput.value);
    const isTelefonoValid = validarTelefono(telefonoInput.value);
    const passwordInput = document.getElementById("password");
    const isPasswordValid = validarPassword(passwordInput.value);

    updateValidationStyles(dniInput, isDniValid);
    updateValidationStyles(emailInput, isEmailValid);
    updateValidationStyles(telefonoInput, isTelefonoValid);
    updateValidationStyles(passwordInput, isPasswordValid);

    // Validar el resto de campos (solo que no estén vacíos ni solo espacios)
    inputs.forEach((input) => {
      const value = input.value.trim();
      if (input === dniInput) {
        if (!isDniValid) allValid = false;
      } else if (input === emailInput) {
        if (!isEmailValid) allValid = false;
      } else if (input === telefonoInput) {
        if (!isTelefonoValid) allValid = false;
      } else if (input === passwordInput) {
        if (!isPasswordValid) allValid = false;
      } else if (input.id === "nombre" || input.id === "apellidos") {
        // Mínimo 6 caracteres, letras y espacios internos (no al inicio ni al final)
        const nameRegex =
          /^[a-zA-ZÁéíóúÁÉÍÓÚñÑ][a-zA-ZÁéíóúÁÉÍÓÚñÑ\s]{4,}[a-zA-ZÁéíóúÁÉÍÓÚñÑ]$/;
        const isValid = nameRegex.test(value);
        updateValidationStyles(input, isValid);
        if (!isValid) allValid = false;
      } else {
        // Otros campos requeridos
        const isValid = value.length > 0;
        updateValidationStyles(input, isValid);
        if (!isValid) allValid = false;
      }
    });

    submitBtn.disabled = !allValid;
  }

  inputs.forEach((input) => {
    input.addEventListener("input", validateForm);
    input.addEventListener("change", validateForm);
  });

  rolSelect.addEventListener("change", () => {
    updateAdminFields();
    validateForm();
  });

  updateAdminFields(); // Inicializar
  validateForm(); // Inicializar estado del botón
</script>
{% endblock %}
