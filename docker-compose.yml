version: "3.9"

services:
  mongodb:
    image: mongo:6
    container_name: mongo_guardias
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rootpassword}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      #Con esta línea inicializamos la BBDD e introducimos varios usuarios      
      - ./docker/mongo-init:/docker-entrypoint-initdb.d 

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-rootpassword}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOST:-mongodb}
    depends_on:
      - mongodb

  flask: 
    build: 
      context: . 
      dockerfile: docker/Dockerfile 
    container_name: flask_guardias 
    restart: always 
    expose: 
      - "${FLASK_PORT}" 
    environment: 
      MONGO_USER: ${MONGO_USER:-root}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-rootpassword}
      MONGO_DB: ${MONGO_DB:-guardias}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      SECRET_KEY: ${SECRET_KEY:-default_secret_key_change_me}
    volumes:
      - .:/app
    depends_on:
      - mongodb

  nginx:
    image: nginx:latest
    container_name: nginx_guardias
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask

volumes:
  mongo_data:
